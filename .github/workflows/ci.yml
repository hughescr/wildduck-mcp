name: Verify and deploy
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run validate
      - uses: actions/upload-artifact@v7
        with:
          name: lambda
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The store's lifecycle test against DynamoDB Local (a local emulator). It needs the emulator, so it is not part of `bun run validate`.
  dynamodb-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 18765:8000
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 1 30); do
            curl --silent --output /dev/null http://127.0.0.1:18765 && exit 0
            sleep 1
          done
          echo 'DynamoDB Local did not answer on 127.0.0.1:18765' >&2
          exit 1
      - name: Run the DynamoDB Local mail store test
        run: bun test tests/mail-dynamo.test.ts
        env:
          DYNAMO_LOCAL_MAIL_TEST: '1'

  deployment-status:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Explain bootstrap requirement
        if: vars.DEPLOY_ENABLED != 'true'
        run: echo 'Deployment is disabled. Follow README bootstrap steps, then set DEPLOY_ENABLED=true. No live service was deployed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate deployment variables
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          BUCKET: ${{ vars.AWS_DEPLOYMENT_BUCKET_NAME }}
          EXECUTION_ROLE: ${{ vars.AWS_EXECUTION_ROLE_ARN }}
          AUTH_KEYRING_PARAMETER: ${{ vars.AUTH_KEYRING_PARAMETER }}
          ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: |
          test -n "$ROLE"
          test -n "$BUCKET"
          test -n "$EXECUTION_ROLE"
          test -n "$ACCESS_KEY"
          test "$AUTH_KEYRING_PARAMETER" = /wildduck-mcp/prod/auth-keyring

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [verify, dynamodb-local, deployment-status]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: lambda
          path: dist
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: deploy-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy verified artifact
        run: bun run deploy
        env:
          AWS_DEPLOYMENT_BUCKET_NAME: ${{ vars.AWS_DEPLOYMENT_BUCKET_NAME }}
          AWS_EXECUTION_ROLE_ARN: ${{ vars.AWS_EXECUTION_ROLE_ARN }}
          AUTH_KEYRING_PARAMETER: ${{ vars.AUTH_KEYRING_PARAMETER }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          WILDDUCK_DOT_AS_PLUS: ${{ vars.WILDDUCK_DOT_AS_PLUS || 'false' }}
          WILDDUCK_STRIP_REPLY_SUFFIX: ${{ vars.WILDDUCK_STRIP_REPLY_SUFFIX || 'true' }}
      - name: Verify live OAuth readiness
        run: node scripts/verify-deployment.mjs
        env:
          STACK_NAME: wildduck-mcp-prod
          AWS_REGION: us-west-2
          WILDDUCK_DOT_AS_PLUS: ${{ vars.WILDDUCK_DOT_AS_PLUS || 'false' }}
          WILDDUCK_STRIP_REPLY_SUFFIX: ${{ vars.WILDDUCK_STRIP_REPLY_SUFFIX || 'true' }}
